name: Tests

# The release gates from build.ps1, on every push and pull request, on Linux — TESTING.md §0 asks for a non-Windows
# host, and the 1.0.7 upload/PDF-check regression was Windows-specific the other way round.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: phpcs, security sniffs, .pot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, fileinfo, mbstring
          coverage: none
      - run: composer install --no-interaction --no-progress
      - name: PSR gate (.phpcs.xml)
        run: vendor/bin/phpcs -q --runtime-set ignore_warnings_on_exit 1
      - name: Security gate (.phpcs-security.xml, errors only)
        run: vendor/bin/phpcs -q -n --standard=.phpcs-security.xml
      - name: languages/formfabricator.pot is current
        run: php languages/make-pot.php --check

  phpunit:
    name: unit + perf (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 8.1 is the plugin's minimum. The perf suite needs memory_reset_peak_usage() (8.2+) and skips itself on 8.1.
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, fileinfo, mbstring, openssl, zlib
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpunit --testsuite unit,perf

  integration:
    name: WordPress integration (PHP ${{ matrix.php }}, ${{ matrix.site }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
        site: ['single', 'multisite']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      WP_TESTS_DB_HOST: 127.0.0.1:3306
      WP_MULTISITE: ${{ matrix.site == 'multisite' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, fileinfo, mbstring, openssl, zlib, mysqli
          coverage: none
      - run: composer install --no-interaction --no-progress
      # Real WordPress (vendor/roots/wordpress-no-content) against this MySQL; every table in it is recreated.
      - run: vendor/bin/phpunit -c phpunit-integration.xml.dist

  js:
    name: JS suite (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      # PHP writes the fixture the JS suite runs against (tests/js/build-fixture.php).
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, fileinfo, mbstring
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: composer install --no-interaction --no-progress
      - run: npm ci --no-audit --no-fund
      - run: npm test
