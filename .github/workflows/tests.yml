name: Tests

# The release gates from tools/build.php, on every push and pull request, on Linux — TESTING.md §0 asks for a non-Windows
# host, since the release build usually runs on Windows and file handling differs between the two.
on:
  push:
  pull_request:

permissions:
  contents: read

# Actions are pinned to a commit, like every other dependency (composer.lock, package-lock.json, the ALTCHA widget by SHA-256):
# a tag can be moved to other code. The comment names the release; update both together.

jobs:
  lint:
    name: phpcs, security sniffs, .pot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: gd, fileinfo, mbstring
          coverage: none
      - run: composer install --no-interaction --no-progress
      - name: PSR gate (.phpcs.xml)
        run: vendor/bin/phpcs -q --runtime-set ignore_warnings_on_exit 1
      - name: Security gate (.phpcs-security.xml, errors only)
        run: vendor/bin/phpcs -q -n --standard=.phpcs-security.xml
      - name: languages/formfabricator.pot is current
        run: php languages/make-pot.php --check

  phpunit:
    name: unit + perf (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 8.1 is the plugin's minimum. The perf suite needs memory_reset_peak_usage() (8.2+) and skips itself on 8.1.
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          # intl, as most hosts have it: its Normalizer changes how the PDF check reads text. A local run without it
          # covers the other path.
          extensions: gd, fileinfo, mbstring, openssl, zlib, intl
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpunit -c tests/phpunit.xml.dist --testsuite unit,perf

  integration:
    name: WordPress integration (PHP ${{ matrix.php }}, ${{ matrix.site }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
        site: ['single', 'multisite']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      WP_TESTS_DB_HOST: 127.0.0.1:3306
      WP_MULTISITE: ${{ matrix.site == 'multisite' && '1' || '0' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, fileinfo, mbstring, openssl, zlib, mysqli, intl
          coverage: none
      - run: composer install --no-interaction --no-progress
      # Real WordPress (vendor/roots/wordpress-no-content) against this MySQL; every table in it is recreated.
      - run: vendor/bin/phpunit -c tests/phpunit-integration.xml.dist

  js:
    name: JS suite (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # PHP writes the fixture the JS suite runs against (tests/js/build-fixture.php).
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: gd, fileinfo, mbstring
          coverage: none
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: composer install --no-interaction --no-progress
      - run: npm ci --no-audit --no-fund
      - run: npm test

  e2e:
    name: E2E (Chromium, Firefox, WebKit)
    runs-on: ubuntu-latest
    # A stalled step fails the job instead of holding the runner for GitHub's six-hour limit.
    timeout-minutes: 40
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      WP_TESTS_DB_HOST: 127.0.0.1:3306
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: gd, fileinfo, mbstring, openssl, zlib, mysqli, intl
          coverage: none
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-interaction --no-progress
      - run: npm ci --no-audit --no-fund
      # The runner's Google Chrome serves as Chromium (tests/e2e/support/browsers.js); Firefox and WebKit, Safari's
      # engine, are Playwright's own builds, kept between runs for the Playwright version package-lock.json pins.
      - name: Playwright version
        id: playwright
        run: |
          version=$(node -p "require('@playwright/test/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-firefox-webkit
      # The system libraries Firefox and WebKit need, through apt. A package mirror can stall a download without ever
      # timing out, so apt gives up on a silent connection after 30 s, and the whole install is capped and retried.
      - name: System libraries for Firefox and WebKit
        timeout-minutes: 20
        run: |
          echo 'Acquire::Retries "3"; Acquire::http::Timeout "30"; Acquire::https::Timeout "30"; DPkg::Lock::Timeout "60";' \
            | sudo tee /etc/apt/apt.conf.d/99-fabricator-timeouts > /dev/null
          # timeout runs as root, so a stalled apt (root's) is stopped too and leaves no lock for the next attempt.
          for attempt in 1 2 3; do
            sudo env "PATH=$PATH" timeout --kill-after=15s 6m npx playwright install-deps firefox webkit && exit 0
            echo "::warning::Installing the browsers' system libraries failed or stalled (attempt $attempt of 3)."
            sleep 10
          done
          exit 1
      - name: Firefox and WebKit
        timeout-minutes: 10
        run: npx playwright install firefox webkit
      # The site is installed afresh on this MySQL (tables prefixed e2e_) and served by `php -S`.
      - name: E2E suite
        timeout-minutes: 20
        run: npx playwright test -c tests/e2e
